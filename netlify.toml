# Netlify build settings for PAWPAL.
#
# Netlify detects Next.js by itself and installs its own Next.js Runtime (the
# OpenNext adapter), which turns the `.next` output into the functions and
# static assets the site is served from. There is deliberately no custom
# server and no hand-written function here: app/api/[...path]/route.ts, the
# auth routes under app/signin, app/signout and app/auth/, and every page are
# ordinary Next.js server routes, and the adapter is what runs them.
#
# Nothing secret belongs in this file — it is committed to the repository.
# SESSION_SECRET, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, TURSO_DATABASE_URL,
# TURSO_AUTH_TOKEN and ADMIN_EMAIL are set by the shop owner in the Netlify UI
# (Site configuration -> Environment variables). See docs/deploy-netlify.md.
#
# Netlify Blobs needs no configuration: lib/blob-store.ts detects Netlify and
# opens the "pawpal-media" store (NETLIFY_BLOBS_STORE overrides the name).

[build]
  # npm ci runs first, from package-lock.json, because the lockfile is committed.
  command = "npm run build"
  # Deliberately no `publish`. Netlify's Next.js Runtime decides the publish
  # directory itself; setting it to ".next" made Netlify serve that folder as
  # plain static files, so the first deploy shipped zero functions and every
  # API, auth and admin route 404'd.

[build.environment]
  # Pinned to package.json's `engines.node` floor (">=22.13.0"). These two are
  # the same decision written twice: change them together.
  NODE_VERSION = "22.13.0"

# Declared explicitly on purpose. Netlify's docs say the Next.js Runtime is
# installed automatically, and for sites created in the UI it is — but this
# site is built from an API-uploaded source zip and two deploys in a row came
# back with plugin_state "none" and zero functions, which meant every server
# route 404'd. Declaring the package forces the runtime to install at build
# time. The version is deliberately unpinned: Netlify updates the adapter for
# each Next.js release and recommends against pinning it.
[[plugins]]
  package = "@netlify/plugin-nextjs"
